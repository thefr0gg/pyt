[tool.poetry]
name = "pyt"
version = "2.1.0"
description = "A maintained pytube fork for downloading YouTube videos."
authors = ["ramsy0dev <ramsy0dev@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/ramsy0dev/pyt"
repository = "https://github.com/ramsy0dev/pyt"
keywords = ["youtube", "download", "video", "pyt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Vendored data files (PO-token JS launcher) need to ship inside the
# wheel so `pyt --doctor --install po-token-generator` can copy them out
# at install time. Without this glob, pyt/data/*.js gets dropped by the
# wheel builder.
include = [
    { path = "pyt/data/*.js", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
mutagen = ">=1.48.1"
browser-cookie3 = ">=0.20.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = ">=7.1.0,<8"
pytest-mock = "^3.16.0"
mypy = "^2.4.0"
black = ">=26.5.1,<27.0.0"
typing-extensions = "^4.16.0"

[tool.poetry.plugins."console_scripts"]
pyt = "pyt.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Legacy tests intentionally exercise the deprecated YouTube/Playlist/etc.
    # surface, and the upscale tests intentionally fire the experimental
    # FutureWarning. Silence both here so the suite stays readable; tests
    # that explicitly assert on these use pytest.warns / catch_warnings,
    # which work regardless of this filter.
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
